<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Royal FFA/Jr. FFA-S.A.E.P. Visitation Record</title>
    <style>
        :root {
            --national-blue: #002D62;
            --corn-gold: #EAA113;
            --light-bg: #F4F6F9;
            --border-color: #CBD5E1;
            --text-dark: #1E293B;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--light-bg);
            color: var(--text-dark);
            padding: 15px;
            max-width: 900px;
            margin: 0 auto;
        }

        .header {
            background-color: var(--national-blue);
            color: white;
            padding: 20px;
            border-radius: 8px 8px 0 0;
            text-align: center;
            border-bottom: 5px solid var(--corn-gold);
        }

        .header h1 {
            font-size: 1.5rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            text-decoration: underline;
        }

        .edit-banner {
            background-color: #FEF3C7;
            border: 2px dashed var(--corn-gold);
            color: #92400E;
            padding: 12px 20px;
            margin-bottom: 15px;
            border-radius: 6px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-weight: bold;
        }

        .edit-banner button {
            background-color: #DC2626;
            color: white;
            border: none;
            padding: 6px 12px;
            border-radius: 4px;
            cursor: pointer;
        }

        form {
            background: white;
            padding: 25px;
            border-radius: 0 0 8px 8px;
            box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1);
        }

        .grid-2 {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin-bottom: 15px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 5px;
        }

        label {
            font-weight: 600;
            font-size: 0.9rem;
            color: var(--national-blue);
        }

        input[type="text"],
        input[type="date"],
        input[type="time"],
        input[type="email"],
        textarea {
            padding: 10px;
            border: 1px solid var(--border-color);
            border-radius: 4px;
            font-size: 1rem;
            width: 100%;
        }

        textarea {
            resize: vertical;
            min-height: 80px;
        }

        .section-title {
            font-size: 1.1rem;
            font-weight: bold;
            color: var(--national-blue);
            margin: 20px 0 10px 0;
            padding-bottom: 5px;
            border-bottom: 2px solid var(--corn-gold);
        }

        .checkbox-group {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 10px;
            margin-bottom: 15px;
        }

        .checkbox-item {
            display: flex;
            align-items: center;
            gap: 8px;
            background: #F8FAFC;
            padding: 8px 12px;
            border: 1px solid var(--border-color);
            border-radius: 4px;
            cursor: pointer;
        }

        .checkbox-item input[type="checkbox"] {
            width: 18px;
            height: 18px;
            accent-color: var(--national-blue);
        }

        .recommendation-item {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 10px;
            flex-wrap: wrap;
        }

        .recommendation-item input[type="text"] {
            flex: 1;
            min-width: 200px;
        }

        .signature-container {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-top: 20px;
        }

        .signature-box {
            border: 1px solid var(--border-color);
            border-radius: 6px;
            padding: 10px;
            background: #F8FAFC;
        }

        canvas {
            border: 1px dashed #94A3B8;
            background: white;
            width: 100%;
            height: 120px;
            border-radius: 4px;
            touch-action: none;
        }

        .signature-actions {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 5px;
        }

        .btn-clear {
            background: #94A3B8;
            color: white;
            border: none;
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 0.8rem;
            cursor: pointer;
        }

        .btn-group {
            display: flex;
            gap: 10px;
            margin-top: 25px;
            flex-wrap: wrap;
        }

        .btn {
            flex: 1;
            min-width: 150px;
            padding: 12px 20px;
            border: none;
            border-radius: 6px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            text-align: center;
            transition: opacity 0.2s;
        }

        .btn:hover {
            opacity: 0.9;
        }

        .btn-primary {
            background-color: var(--national-blue);
            color: white;
        }

        .btn-secondary {
            background-color: var(--corn-gold);
            color: var(--national-blue);
        }

        .btn-outline {
            background-color: transparent;
            border: 2px solid var(--national-blue);
            color: var(--national-blue);
        }

        .history-section {
            margin-top: 40px;
            background: white;
            padding: 25px;
            border-radius: 8px;
            box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1);
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 15px;
        }

        th, td {
            border: 1px solid var(--border-color);
            padding: 10px;
            text-align: left;
            font-size: 0.9rem;
        }

        th {
            background-color: #F1F5F9;
            color: var(--national-blue);
        }

        .status-badge {
            padding: 3px 8px;
            border-radius: 12px;
            font-size: 0.75rem;
            font-weight: bold;
            text-transform: uppercase;
        }

        .status-draft {
            background: #FEF3C7;
            color: #B45309;
        }

        .status-final {
            background: #D1FAE5;
            color: #065F46;
        }

        .table-actions {
            display: flex;
            gap: 5px;
        }

        .btn-sm {
            padding: 4px 8px;
            font-size: 0.8rem;
            border-radius: 4px;
            border: none;
            cursor: pointer;
        }

        .btn-sm-edit { background: var(--corn-gold); color: var(--national-blue); font-weight: bold; }
        .btn-sm-delete { background: #EF4444; color: white; }

        @media print {
            body { background: white; padding: 0; }
            form { box-shadow: none; padding: 0; }
            .header { background: white !important; color: black !important; border-bottom: 2px solid black; }
            .header h1 { color: black; }
            .btn-group, .history-section, .btn-clear, .edit-banner { display: none !important; }
            input, textarea { border: none !important; border-bottom: 1px solid #000 !important; border-radius: 0; }
            .checkbox-item { border: none; padding: 0; }
            canvas { border: 1px solid #000; }
        }

        @media (max-width: 600px) {
            .grid-2, .signature-container {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>

    <div class="header">
        <h1>Royal FFA/Jr. FFA-S.A.E.P. Visitation Record</h1>
    </div>

    <div id="editBanner" class="edit-banner" style="display: none;">
        <span id="editingTitle">Editing Saved Record</span>
        <button type="button" onclick="cancelEditing()">Cancel Edit</button>
    </div>

    <form id="visitForm">
        <input type="hidden" id="recordId" value="">

        <div class="grid-2">
            <div class="form-group">
                <label for="visitDate">Date:</label>
                <input type="date" id="visitDate" required>
            </div>
            <div class="form-group">
                <label for="visitTime">Time:</label>
                <input type="time" id="visitTime" required>
            </div>
        </div>

        <div class="grid-2">
            <div class="form-group">
                <label for="studentName">Student Name:</label>
                <input type="text" id="studentName" placeholder="Enter student's full name" required>
            </div>
            <div class="form-group">
                <label for="studentEmail">Student Email:</label>
                <input type="email" id="studentEmail" placeholder="student@school.edu">
            </div>
        </div>

        <div class="grid-2">
            <div class="form-group">
                <label for="teacherName">Teacher Name:</label>
                <input type="text" id="teacherName" placeholder="Ag Teacher Name">
            </div>
            <div class="form-group">
                <label for="teacherEmail">Teacher Email (CC):</label>
                <input type="email" id="teacherEmail" placeholder="teacher@school.edu">
            </div>
        </div>

        <div class="section-title">Project(s) Checked</div>
        <div class="checkbox-group">
            <label class="checkbox-item"><input type="checkbox" name="project" value="Market Steer"> Market Steer</label>
            <label class="checkbox-item"><input type="checkbox" name="project" value="Breeding Heifer"> Breeding Heifer</label>
            <label class="checkbox-item"><input type="checkbox" name="project" value="Market Goat"> Market Goat</label>
            <label class="checkbox-item"><input type="checkbox" name="project" value="Market Swine"> Market Swine</label>
            <label class="checkbox-item"><input type="checkbox" name="project" value="Market Broilers"> Market Broilers</label>
        </div>
        <div class="form-group" style="margin-bottom: 15px;">
            <label for="projectOther">Other Project(s):</label>
            <input type="text" id="projectOther" placeholder="Specify other project...">
        </div>

        <div class="section-title">Recommendations</div>
        
        <div class="recommendation-item">
            <label class="checkbox-item"><input type="checkbox" id="chkDeworm"> De-worm w/</label>
            <input type="text" id="dewormText" placeholder="Specify product/dosage...">
        </div>

        <div class="recommendation-item">
            <label class="checkbox-item"><input type="checkbox" id="chkExhibition"> Practice exhibition skills</label>
        </div>

        <div class="recommendation-item">
            <label class="checkbox-item"><input type="checkbox" id="chkClean"> Clean pen/feeder/waterer</label>
        </div>

        <div class="recommendation-item">
            <label class="checkbox-item"><input type="checkbox" id="chkBedding"> Add bedding/sand/shavings to pen</label>
        </div>

        <div class="recommendation-item">
            <label class="checkbox-item"><input type="checkbox" id="chkFeeding"> Change feeding regimen to:</label>
            <input type="text" id="feedingText" placeholder="Describe feeding changes...">
        </div>

        <div class="form-group" style="margin-top: 10px;">
            <label for="extraRecommendations">Additional Recommendations:</label>
            <textarea id="extraRecommendations" placeholder="Additional instructions or suggestions..."></textarea>
        </div>

        <div class="section-title">Other Comments</div>
        <div class="form-group">
            <textarea id="otherComments" placeholder="General observations, project progress, health notes..."></textarea>
        </div>

        <div class="section-title">Signatures</div>
        <div class="signature-container">
            <div class="signature-box">
                <label>Teacher Signature:</label>
                <canvas id="teacherSigCanvas"></canvas>
                <div class="signature-actions">
                    <button type="button" class="btn-clear" onclick="clearSignature('teacherSigCanvas')">Clear</button>
                    <div class="form-group" style="flex: 0.6;">
                        <input type="date" id="teacherSigDate">
                    </div>
                </div>
            </div>

            <div class="signature-box">
                <label>Student Signature:</label>
                <canvas id="studentSigCanvas"></canvas>
                <div class="signature-actions">
                    <button type="button" class="btn-clear" onclick="clearSignature('studentSigCanvas')">Clear</button>
                    <div class="form-group" style="flex: 0.6;">
                        <input type="date" id="studentSigDate">
                    </div>
                </div>
            </div>
        </div>

        <div class="btn-group">
            <button type="button" class="btn btn-outline" onclick="saveRecord('draft')">💾 Save Draft</button>
            <button type="button" class="btn btn-secondary" onclick="saveRecord('finalized')">✅ Save & Finalize</button>
            <button type="button" class="btn btn-primary" onclick="sendEmail()">📧 Email Record</button>
            <button type="button" class="btn btn-outline" onclick="window.print()">🖨️ Print / PDF</button>
        </div>
    </form>

    <div class="history-section">
        <div class="section-title" style="margin-top: 0;">Saved Visitation Records</div>
        <div style="overflow-x: auto;">
            <table id="historyTable">
                <thead>
                    <tr>
                        <th>Date/Time</th>
                        <th>Student</th>
                        <th>Projects</th>
                        <th>Status</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody id="historyBody">
                </tbody>
            </table>
        </div>
    </div>

    <script>
        function setupCanvas(canvasId) {
            const canvas = document.getElementById(canvasId);
            const ctx = canvas.getContext('2d');
            let drawing = false;

            function resizeCanvas() {
                const rect = canvas.getBoundingClientRect();
                canvas.width = rect.width;
                canvas.height = rect.height;
            }
            resizeCanvas();
            window.addEventListener('resize', resizeCanvas);

            function getPos(e) {
                const rect = canvas.getBoundingClientRect();
                const clientX = e.touches ? e.touches[0].clientX : e.clientX;
                const clientY = e.touches ? e.touches[0].clientY : e.clientY;
                return {
                    x: clientX - rect.left,
                    y: clientY - rect.top
                };
            }

            function startDraw(e) {
                drawing = true;
                const pos = getPos(e);
                ctx.beginPath();
                ctx.moveTo(pos.x, pos.y);
            }

            function draw(e) {
                if (!drawing) return;
                e.preventDefault();
                const pos = getPos(e);
                ctx.lineTo(pos.x, pos.y);
                ctx.strokeStyle = "#000";
                ctx.lineWidth = 2;
                ctx.stroke();
            }

            function stopDraw() { drawing = false; }

            canvas.addEventListener('mousedown', startDraw);
            canvas.addEventListener('mousemove', draw);
            canvas.addEventListener('mouseup', stopDraw);
            canvas.addEventListener('touchstart', startDraw);
            canvas.addEventListener('touchmove', draw);
            canvas.addEventListener('touchend', stopDraw);
        }

        setupCanvas('teacherSigCanvas');
        setupCanvas('studentSigCanvas');

        function clearSignature(canvasId) {
            const canvas = document.getElementById(canvasId);
            const ctx = canvas.getContext('2d');
            ctx.clearRect(0, 0, canvas.width, canvas.height);
        }

        const today = new Date().toISOString().split('T')[0];
        document.getElementById('visitDate').value = today;
        document.getElementById('teacherSigDate').value = today;
        document.getElementById('studentSigDate').value = today;
        document.getElementById('visitTime').value = new Date().toTimeString().slice(0,5);

        function getSavedRecords() {
            return JSON.parse(localStorage.getItem('ffa_visitation_records') || '[]');
        }

        function saveRecord(status) {
            const recordId = document.getElementById('recordId').value || 'rec_' + Date.now();
            const projects = Array.from(document.querySelectorAll('input[name="project"]:checked')).map(cb => cb.value);

            const record = {
                id: recordId,
                status: status,
                visitDate: document.getElementById('visitDate').value,
                visitTime: document.getElementById('visitTime').value,
                studentName: document.getElementById('studentName').value,
                studentEmail: document.getElementById('studentEmail').value,
                teacherName: document.getElementById('teacherName').value,
                teacherEmail: document.getElementById('teacherEmail').value,
                projects: projects,
                projectOther: document.getElementById('projectOther').value,
                recommendations: {
                    deworm: { checked: document.getElementById('chkDeworm').checked, text: document.getElementById('dewormText').value },
                    exhibition: document.getElementById('chkExhibition').checked,
                    clean: document.getElementById('chkClean').checked,
                    bedding: document.getElementById('chkBedding').checked,
                    feeding: { checked: document.getElementById('chkFeeding').checked, text: document.getElementById('feedingText').value },
                    extra: document.getElementById('extraRecommendations').value
                },
                otherComments: document.getElementById('otherComments').value,
                teacherSigData: document.getElementById('teacherSigCanvas').toDataURL(),
                teacherSigDate: document.getElementById('teacherSigDate').value,
                studentSigData: document.getElementById('studentSigCanvas').toDataURL(),
                studentSigDate: document.getElementById('studentSigDate').value
            };

            let records = getSavedRecords();
            const index = records.findIndex(r => r.id === recordId);
            if (index >= 0) {
                records[index] = record;
            } else {
                records.unshift(record);
            }

            localStorage.setItem('ffa_visitation_records', JSON.stringify(records));
            alert(status === 'draft' ? 'Draft saved successfully!' : 'Record finalized and saved!');
            cancelEditing();
            renderHistory();
        }

        function renderHistory() {
            const records = getSavedRecords();
            const tbody = document.getElementById('historyBody');
            tbody.innerHTML = '';

            if (records.length === 0) {
                tbody.innerHTML = '<tr><td colspan="5" style="text-align:center;">No visitation records saved yet.</td></tr>';
                return;
            }

            records.forEach(r => {
                const tr = document.createElement('tr');
                const projectList = [...r.projects, r.projectOther].filter(Boolean).join(', ');
                const statusBadge = `<span class="status-badge ${r.status === 'draft' ? 'status-draft' : 'status-final'}">${r.status}</span>`;

                tr.innerHTML = `
                    <td>${r.visitDate} ${r.visitTime}</td>
                    <td>${r.studentName || 'N/A'}</td>
                    <td>${projectList || 'None'}</td>
                    <td>${statusBadge}</td>
                    <td class="table-actions">
                        <button class="btn-sm btn-sm-edit" onclick="editRecord('${r.id}')">Edit / Sign</button>
                        <button class="btn-sm btn-sm-delete" onclick="deleteRecord('${r.id}')">Delete</button>
                    </td>
                `;
                tbody.appendChild(tr);
            });
        }

        function editRecord(id) {
            const records = getSavedRecords();
            const r = records.find(item => item.id === id);
            if (!r) return;

            document.getElementById('recordId').value = r.id;
            document.getElementById('visitDate').value = r.visitDate;
            document.getElementById('visitTime').value = r.visitTime;
            document.getElementById('studentName').value = r.studentName;
            document.getElementById('studentEmail').value = r.studentEmail;
            document.getElementById('teacherName').value = r.teacherName;
            document.getElementById('teacherEmail').value = r.teacherEmail;

            document.querySelectorAll('input[name="project"]').forEach(cb => {
                cb.checked = r.projects.includes(cb.value);
            });
            document.getElementById('projectOther').value = r.projectOther || '';

            document.getElementById('chkDeworm').checked = r.recommendations.deworm.checked;
            document.getElementById('dewormText').value = r.recommendations.deworm.text || '';
            document.getElementById('chkExhibition').checked = r.recommendations.exhibition;
            document.getElementById('chkClean').checked = r.recommendations.clean;
            document.getElementById('chkBedding').checked = r.recommendations.bedding;
            document.getElementById('chkFeeding').checked = r.recommendations.feeding.checked;
            document.getElementById('feedingText').value = r.recommendations.feeding.text || '';
            document.getElementById('extraRecommendations').value = r.recommendations.extra || '';

            document.getElementById('otherComments').value = r.otherComments || '';
            document.getElementById('teacherSigDate').value = r.teacherSigDate || '';
            document.getElementById('studentSigDate').value = r.studentSigDate || '';

            loadSigToCanvas('teacherSigCanvas', r.teacherSigData);
            loadSigToCanvas('studentSigCanvas', r.studentSigData);

            document.getElementById('editBanner').style.display = 'flex';
            document.getElementById('editingTitle').innerText = `Editing Record for ${r.studentName || 'Student'} (${r.visitDate})`;
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function loadSigToCanvas(canvasId, dataUrl) {
            clearSignature(canvasId);
            if (!dataUrl) return;
            const canvas = document.getElementById(canvasId);
            const ctx = canvas.getContext('2d');
            const img = new Image();
            img.onload = function() { ctx.drawImage(img, 0, 0); };
            img.src = dataUrl;
        }

        function cancelEditing() {
            document.getElementById('recordId').value = '';
            document.getElementById('visitForm').reset();
            clearSignature('teacherSigCanvas');
            clearSignature('studentSigCanvas');
            document.getElementById('editBanner').style.display = 'none';
        }

        function deleteRecord(id) {
            if (confirm('Are you sure you want to delete this record?')) {
                let records = getSavedRecords().filter(r => r.id !== id);
                localStorage.setItem('ffa_visitation_records', JSON.stringify(records));
                renderHistory();
            }
        }

        function sendEmail() {
            const studentEmail = document.getElementById('studentEmail').value;
            const teacherEmail = document.getElementById('teacherEmail').value;
            const studentName = document.getElementById('studentName').value;
            const visitDate = document.getElementById('visitDate').value;

            if (!studentEmail) {
                alert('Please enter a Student Email address to send the form.');
                return;
            }

            const subject = encodeURIComponent(`Royal FFA SAE Visitation Record - ${studentName} (${visitDate})`);
            
            let body = `Royal FFA/Jr. FFA-S.A.E.P. Visitation Record\n`;
            body += `-------------------------------------------\n`;
            body += `Date: ${document.getElementById('visitDate').value}\n`;
            body += `Time: ${document.getElementById('visitTime').value}\n`;
            body += `Student: ${studentName}\n\n`;

            const projects = Array.from(document.querySelectorAll('input[name="project"]:checked')).map(cb => cb.value);
            if (document.getElementById('projectOther').value) projects.push(document.getElementById('projectOther').value);
            body += `Project(s) Checked: ${projects.join(', ') || 'None'}\n\n`;

            body += `Recommendations:\n`;
            if (document.getElementById('chkDeworm').checked) body += `- De-worm w/ ${document.getElementById('dewormText').value}\n`;
            if (document.getElementById('chkExhibition').checked) body += `- Practice exhibition skills\n`;
            if (document.getElementById('chkClean').checked) body += `- Clean pen/feeder/waterer\n`;
            if (document.getElementById('chkBedding').checked) body += `- Add bedding/sand/shavings to pen\n`;
            if (document.getElementById('chkFeeding').checked) body += `- Change feeding regimen to: ${document.getElementById('feedingText').value}\n`;
            if (document.getElementById('extraRecommendations').value) body += `- Extra: ${document.getElementById('extraRecommendations').value}\n`;

            body += `\nOther Comments:\n${document.getElementById('otherComments').value || 'None'}\n\n`;
            body += `Signatures captured on digital record.\n`;

            let mailtoUrl = `mailto:${studentEmail}?subject=${subject}&body=${encodeURIComponent(body)}`;
            if (teacherEmail) {
                mailtoUrl += `&cc=${teacherEmail}`;
            }

            window.location.href = mailtoUrl;
        }

        renderHistory();
    </script>
</body>
</html>
